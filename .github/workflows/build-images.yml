name: Build images

on:
   push:
      branches: [main, dev]
   workflow_dispatch:

jobs:
   build:
      runs-on: ubuntu-latest

      # GITHUB_TOKEN is read-only by default; pushing to ghcr.io needs write.
      permissions:
         packages: write

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Log in to ghcr.io
           run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

         # ghcr.io rejects uppercase in image names, so the owner is spelled out
         # in lower case instead of coming from the github context.
         - name: Build api image
           run: docker build -f apps/api/Dockerfile -t ghcr.io/0romanshevchuk0/rooms-api:latest .

         - name: Build web image
           run: docker build -f apps/web/Dockerfile -t ghcr.io/0romanshevchuk0/rooms-web:latest .

         - name: Push images
           run: |
              docker push ghcr.io/0romanshevchuk0/rooms-api:latest
              docker push ghcr.io/0romanshevchuk0/rooms-web:latest
